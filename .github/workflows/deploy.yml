
name: Deploy CloudOps to AWS EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudops-production
  cancel-in-progress: false

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run automated tests
        run: python -m pytest -q

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy tested commit using SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-068fd3d6b09209381"

          PARAMS=$(printf \
            '{"commands":["/usr/local/sbin/cloudops-deploy %s"]}' \
            "$GITHUB_SHA")

          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$PARAMS" \
            --comment "Deploy CloudOps commit $GITHUB_SHA" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" || true

            echo "Deployment failed."
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json

      - name: Verify public HTTPS application
        run: |
          set -euo pipefail

          curl -fsS \
            --retry 5 \
            --retry-delay 2 \
            --max-time 10 \
            https://cloudops-portfolio.duckdns.org/health \
          | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          assert data["status"] == "healthy"
          assert data["service"] == "cloudops"
          print("Public health check passed")
          '
